<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Review Studio</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script><body><header><div><h1>Audio Review Studio</h1><span>AI Auto Cut Pro · Phiên duyệt cục bộ</span></div><div><label id="progressText" for="progress"></label><progress id="progress" value="0" max="1"></progress></div></header><main><aside><label for="filter">Danh sách đề xuất</label><select id="filter"><option value="">Tất cả</option><option>REVIEW</option><option>KEEP</option><option>APPROVE</option></select><nav id="list" aria-label="Đề xuất"></nav></aside><article><div class="toolbar"><button id="prev">← Trước</button><button id="next">Sau →</button><span id="position"></span></div><h2 id="title">Đang tải…</h2><p id="detail"></p><section class="monitor" aria-label="Nghe đối chiếu"><div class="toolbar"><button id="before" aria-pressed="true">A · Trước khi cắt</button><button id="after" aria-pressed="false">B · Sau khi cắt</button></div><canvas id="wave" aria-label="Dạng sóng và vùng cắt"></canvas><p id="legend"></p><audio id="player" controls preload="metadata"></audio></section><div class="toolbar decisions"><button data-status="KEEP">1 · Giữ nguyên</button><button data-status="APPROVE">2 · Duyệt cắt</button><button data-status="REVIEW">3 · Nghe lại</button></div><p class="hint">Space phát/dừng · ←/→ chuyển đoạn · A/B đổi bản · R nghe lại</p><footer><label><input id="mp3" type="checkbox"> Xuất thêm MP3</label><button id="export">Kết thúc duyệt và xuất WAV</button><p id="message" role="status" aria-live="polite"></p></footer></article></main></body></html>
